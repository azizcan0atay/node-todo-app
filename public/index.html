<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Görevlerim | Sade To-Do Uygulaması</title>
  <meta name="description"
    content="Node.js ile geliştirilmiş sade, hızlı ve kullanışlı To-Do (Yapılacaklar) listesi uygulaması.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-wrapper">
    <main class="todo-card">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <div class="logo-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 11 3 3L22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
          </div>
          <div>
            <h1>Görevlerim</h1>
            <p id="current-date" class="date-text">Yükleniyor...</p>
          </div>
        </div>
        <div class="progress-container" title="Tamamlanma Oranı">
          <span id="progress-percent" class="progress-percent">0%</span>
          <div class="progress-bar-bg">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
          </div>
        </div>
      </header>

      <!-- Input Section -->
      <form id="todo-form" class="todo-form">
        <div class="input-group">
          <input type="text" id="todo-input" placeholder="Yeni bir görev yazın ve Enter'a basın..." autocomplete="off"
            maxlength="120" required aria-label="Yeni görev" />
          <button type="submit" id="add-btn" class="btn-primary" aria-label="Görevi ekle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Ekle</span>
          </button>
        </div>
      </form>

      <!-- Controls & Filters -->
      <div class="controls-bar">
        <div class="filters" role="tablist" aria-label="Görev filtreleri">
          <button type="button" class="filter-btn active" data-filter="all" id="filter-all" role="tab"
            aria-selected="true">
            Tümü <span id="count-all" class="badge">0</span>
          </button>
          <button type="button" class="filter-btn" data-filter="active" id="filter-active" role="tab"
            aria-selected="false">
            Yapılacak <span id="count-active" class="badge">0</span>
          </button>
          <button type="button" class="filter-btn" data-filter="completed" id="filter-completed" role="tab"
            aria-selected="false">
            Biten <span id="count-completed" class="badge">0</span>
          </button>
        </div>

        <button type="button" id="clear-completed-btn" class="btn-text-danger" title="Tamamlanan görevleri toplu sil">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Bitenleri Sil</span>
        </button>
      </div>

      <!-- Todo List -->
      <div class="list-container">
        <ul id="todo-list" class="todo-list" aria-label="Görev listesi">
          <!-- Dinamik olarak doldurulur -->
        </ul>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
          <h2 id="empty-title">Henüz görev yok</h2>
          <p id="empty-desc">Yeni bir görev ekleyerek güne başlayabilirsiniz.</p>
        </div>
      </div>

      <!-- Footer Info -->
      <footer class="app-footer">
        <span id="remaining-count" class="footer-info">0 görev kaldı</span>
        <span class="footer-hint">İpucu: İşaretlemek için göreve tıklayın</span>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>

</html>
